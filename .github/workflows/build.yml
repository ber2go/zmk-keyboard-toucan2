name: Build ZMK firmware
on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@v0.3

  label:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Compute label
        id: label
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          if [ -n "$PR_NUMBER" ]; then
            echo "value=pr${PR_NUMBER}-${PR_SHA::7}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${REF_NAME//\//-}-${SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download firmware
        uses: actions/download-artifact@v4
        with:
          name: firmware
          path: firmware

      - name: Rename firmware files
        env:
          LABEL: ${{ steps.label.outputs.value }}
        run: |
          cd firmware
          for f in *.uf2; do mv "$f" "${f%.uf2}-${LABEL}.uf2"; done
          ls

      - name: Upload labeled firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ steps.label.outputs.value }}
          path: firmware/*.uf2
